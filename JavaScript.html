<script>(function(){var step=1,slot=null,token="",visitor=localStorage.getItem("cccVisitor")||(crypto.randomUUID?crypto.randomUUID():String(Date.now())),f=document.getElementById("f"),date=document.getElementById("date"),time=document.getElementById("time"),msg=document.getElementById("msg");localStorage.setItem("cccVisitor",visitor);function show(){document.querySelectorAll(".step").forEach(function(x){x.classList.toggle("active",+x.dataset.step===step)});document.getElementById("stepLabel").textContent="Step "+step+" of 4";document.getElementById("bar").style.width=(step*25)+"%";document.getElementById("back").disabled=step===1;document.getElementById("next").classList.toggle("hidden",step===4);document.getElementById("confirm").classList.toggle("hidden",step!==4);if(step===4&&date.options.length<2)loadDates()}function error(t){msg.textContent=t;msg.classList.remove("hidden")}function clear(){msg.classList.add("hidden")}function valid(){var a=document.querySelector('.step[data-step="'+step+'"]');for(var x of a.querySelectorAll("input,select,textarea")){if(!x.checkValidity()){x.reportValidity();return false}}if(step===4&&!slot){error("Please select a date and time.");return false}return true}function loadDates(){google.script.run.withSuccessHandler(function(r){if(!r.success)return error(r.message);date.innerHTML='<option value="">Select a date</option>';r.data.forEach(function(x){date.innerHTML+='<option value="'+x.isoDate+'">'+x.displayDate+' ('+x.availableSlotCount+' available)</option>'})}).getAvailableDates(token,visitor)}date.onchange=function(){slot=null;time.disabled=true;if(!date.value)return;google.script.run.withSuccessHandler(function(r){if(!r.success)return error(r.message);time.innerHTML='<option value="">Select a time</option>';r.data.forEach(function(x,i){var o=document.createElement("option");o.value=i;o.textContent=x.displayTime;o.dataset.slot=JSON.stringify(x);time.appendChild(o)});time.disabled=false}).getAvailableTimes(token,visitor,date.value)};time.onchange=function(){var o=time.options[time.selectedIndex];slot=o&&o.dataset.slot?JSON.parse(o.dataset.slot):null};document.getElementById("next").onclick=function(){clear();if(valid()){step++;show()}};document.getElementById("back").onclick=function(){if(step>1){step--;show()}};f.onsubmit=function(e){e.preventDefault();clear();if(!valid())return;var d={},fd=new FormData(f);fd.forEach(function(v,k){if(k==="businessChallenges"){d[k]=d[k]||[];d[k].push(v)}else d[k]=v});d.businessChallenges=d.businessChallenges||[];d.consentToContact=f.elements.consentToContact.checked;d.sessionToken=token;d.visitorId=visitor;d.submissionToken=crypto.randomUUID?crypto.randomUUID():String(Date.now());d.slotStart=slot.start;d.slotEnd=slot.end;google.script.run.withSuccessHandler(function(r){if(!r.success)return error(r.message);f.classList.add("hidden");document.getElementById("done").innerHTML='<h2>Consultation Confirmed</h2><strong>'+r.data.appointmentId+'</strong><p>'+r.data.appointmentDate+'<br>'+r.data.appointmentTime+'<br>'+r.data.timeZone+'</p>';document.getElementById("done").classList.remove("hidden")}).confirmConsultation(d)};google.script.run.withSuccessHandler(function(r){if(!r.success)return error(r.message);token=r.data.sessionToken;show()}).createSchedulerSession(visitor)})();</script>
