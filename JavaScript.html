<script>

(function () {

  "use strict";


  /* ========================================================
     STATE
  ======================================================== */

  var slot = null;

  var selectedDate = "";

  var selectedDisplayDate = "";

  var token = "";

  var calendarLoaded = false;


  var visitor =
    localStorage.getItem(
      "cccVisitor"
    ) ||
    (
      window.crypto &&
      crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now())
    );


  localStorage.setItem(
    "cccVisitor",
    visitor
  );


  /* ========================================================
     ELEMENTS
  ======================================================== */

  var form =
    document.getElementById(
      "f"
    );


  var message =
    document.getElementById(
      "msg"
    );


  var calendarGrid =
    document.getElementById(
      "calendarGrid"
    );


  var calendarLoading =
    document.getElementById(
      "calendarLoading"
    );


  var calendarContent =
    document.getElementById(
      "calendarContent"
    );


  var timeGrid =
    document.getElementById(
      "timeGrid"
    );


  var timeLoading =
    document.getElementById(
      "timeLoading"
    );


  var timeTitle =
    document.getElementById(
      "timeTitle"
    );


  var timeHelp =
    document.getElementById(
      "timeHelp"
    );


  var selectedAppointment =
    document.getElementById(
      "selectedAppointment"
    );


  var confirmButton =
    document.getElementById(
      "confirm"
    );


  var refreshCalendarButton =
    document.getElementById(
      "refreshCalendar"
    );


  /* ========================================================
     GENERAL MESSAGE HANDLING
  ======================================================== */

  function showError(text) {

    message.textContent =
      text ||
      "We could not complete the request.";


    message.classList.remove(
      "hidden"
    );


    message.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }


  function clearError() {

    message.textContent = "";

    message.classList.add(
      "hidden"
    );

  }


  function serverFailure(error) {

    console.error(error);


    var text =
      (
        error &&
        error.message
      )
        ? error.message
        : "We could not complete the request. Please try again.";


    showError(text);

  }


  /* ========================================================
     CLIENT-SIDE URL NORMALIZATION
     --------------------------------------------------------
     The server performs the authoritative normalization.
     This simply makes the visitor experience cleaner.
  ======================================================== */

  function normalizeVisibleUrlField(field) {

    if (!field) {
      return;
    }


    var value =
      String(
        field.value || ""
      ).trim();


    if (!value) {
      return;
    }


    if (
      !/^https?:\/\//i.test(
        value
      )
    ) {
      field.value =
        "https://" +
        value;
    }

  }


  var websiteField =
    form.elements.website;


  if (websiteField) {

    websiteField.addEventListener(
      "blur",
      function () {
        normalizeVisibleUrlField(
          websiteField
        );
      }
    );

  }


  /* ========================================================
     FORM VALIDATION
  ======================================================== */

  function validateForm() {

    clearError();


    var fields =
      form.querySelectorAll(
        "input, select, textarea"
      );


    for (
      var i = 0;
      i < fields.length;
      i++
    ) {

      if (
        !fields[i].checkValidity()
      ) {

        fields[i].reportValidity();

        fields[i].scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

        return false;

      }

    }


    if (!slot) {

      showError(
        "Please select an available consultation date and appointment time."
      );

      return false;

    }


    return true;

  }


  /* ========================================================
     CALENDAR AVAILABILITY
  ======================================================== */

  function loadCalendar() {

    clearError();


    if (!token) {

      calendarLoading.textContent =
        "Starting secure scheduling session...";

      return;

    }


    calendarLoaded = false;

    slot = null;

    selectedDate = "";

    selectedDisplayDate = "";


    calendarGrid.innerHTML = "";

    timeGrid.innerHTML = "";


    selectedAppointment.classList.add(
      "hidden"
    );

    selectedAppointment.innerHTML = "";


    timeHelp.textContent =
      "Choose a green available date to view appointment times.";


    calendarContent.classList.add(
      "hidden"
    );


    calendarLoading.classList.remove(
      "hidden"
    );


    calendarLoading.textContent =
      "Checking CCC calendar availability...";


    google.script.run

      .withFailureHandler(
        function (error) {

          calendarLoading.classList.add(
            "hidden"
          );

          serverFailure(error);

        }
      )

      .withSuccessHandler(
        function (result) {

          calendarLoading.classList.add(
            "hidden"
          );


          if (
            !result ||
            !result.success
          ) {

            showError(
              (
                result &&
                result.message
              )
                ? result.message
                : "Calendar availability could not be loaded."
            );

            return;

          }


          renderCalendar(
            result.data
          );


          calendarLoaded = true;

        }
      )

      .getCalendarAvailability(
        token,
        visitor
      );

  }


  function renderCalendar(data) {

    calendarGrid.innerHTML = "";


    var dates =
      (
        data &&
        Array.isArray(
          data.dates
        )
      )
        ? data.dates
        : [];


    dates.forEach(
      function (item) {

        var day =
          document.createElement(
            item.selectable
              ? "button"
              : "div"
          );


        if (
          item.selectable
        ) {
          day.type = "button";
        }


        day.className =
          "calendar-day status-" +
          item.status;


        day.dataset.date =
          item.isoDate;


        day.setAttribute(
          "role",
          "gridcell"
        );


        var statusText =
          calendarStatusText(
            item
          );


        day.setAttribute(
          "aria-label",
          item.displayDate +
          ". " +
          statusText
        );


        day.innerHTML =

          '<span class="month">' +
            escapeHtml(
              item.monthShort
            ) +
          '</span>' +

          '<span class="number">' +
            escapeHtml(
              String(
                item.dayNumber
              )
            ) +
          '</span>' +

          '<span class="availability">' +
            escapeHtml(
              statusText
            ) +
          '</span>';


        if (
          item.selectable
        ) {

          day.addEventListener(
            "click",
            function () {

              selectCalendarDate(
                item,
                day
              );

            }
          );

        }


        calendarGrid.appendChild(
          day
        );

      }
    );


    calendarContent.classList.remove(
      "hidden"
    );

  }


  function calendarStatusText(
    item
  ) {

    switch (
      item.status
    ) {

      case "available":

        return (
          item.availableSlotCount +
          (
            item.availableSlotCount === 1
              ? " time"
              : " times"
          )
        );


      case "full":
        return "Full";


      case "weekend":
        return "Weekend";


      case "past":
        return "Past";


      case "lead":
        return "Unavailable";


      case "outside":
        return "Unavailable";


      default:
        return "Unavailable";

    }

  }


  function selectCalendarDate(
    item,
    button
  ) {

    clearError();


    selectedDate =
      item.isoDate;


    selectedDisplayDate =
      item.displayDate;


    slot = null;


    document
      .querySelectorAll(
        ".calendar-day.selected"
      )
      .forEach(
        function (element) {

          element.classList.remove(
            "selected"
          );

        }
      );


    button.classList.add(
      "selected"
    );


    selectedAppointment.classList.add(
      "hidden"
    );


    selectedAppointment.innerHTML = "";


    loadTimes(
      selectedDate,
      selectedDisplayDate
    );

  }


  /* ========================================================
     AVAILABLE TIMES
  ======================================================== */

  function loadTimes(
    isoDate,
    displayDate
  ) {

    clearError();


    slot = null;


    timeGrid.innerHTML = "";


    timeTitle.textContent =
      "Available Times";


    timeHelp.textContent =
      displayDate +
      " · Pacific Time";


    timeLoading.classList.remove(
      "hidden"
    );


    google.script.run

      .withFailureHandler(
        function (error) {

          timeLoading.classList.add(
            "hidden"
          );

          serverFailure(error);

        }
      )

      .withSuccessHandler(
        function (result) {

          timeLoading.classList.add(
            "hidden"
          );


          if (
            !result ||
            !result.success
          ) {

            showError(
              (
                result &&
                result.message
              )
                ? result.message
                : "Available times could not be loaded."
            );

            return;

          }


          renderTimes(
            result.data || [],
            displayDate
          );

        }
      )

      .getAvailableTimes(
        token,
        visitor,
        isoDate
      );

  }


  function renderTimes(
    slots,
    displayDate
  ) {

    timeGrid.innerHTML = "";


    if (!slots.length) {

      timeGrid.innerHTML =

        '<div class="no-times">' +
          'No appointment times remain for this date.' +
        '</div>';


      return;

    }


    slots.forEach(
      function (item) {

        var button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "time-option";


        button.textContent =
          item.displayTime;


        button.addEventListener(
          "click",
          function () {

            document
              .querySelectorAll(
                ".time-option.selected"
              )
              .forEach(
                function (
                  element
                ) {

                  element.classList.remove(
                    "selected"
                  );

                }
              );


            button.classList.add(
              "selected"
            );


            slot =
              item;


            selectedAppointment.innerHTML =

              "<strong>Selected consultation</strong><br>" +

              escapeHtml(
                displayDate
              ) +

              "<br>" +

              escapeHtml(
                item.displayTime
              ) +

              " Pacific Time";


            selectedAppointment.classList.remove(
              "hidden"
            );


            clearError();

          }
        );


        timeGrid.appendChild(
          button
        );

      }
    );

  }


  /* ========================================================
     REFRESH CALENDAR
  ======================================================== */

  refreshCalendarButton.addEventListener(
    "click",
    function () {

      loadCalendar();

    }
  );


  /* ========================================================
     CONFIRM APPOINTMENT
  ======================================================== */

  form.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();


      clearError();


      /*
       * Normalize URL visually before FormData is collected.
       */
      normalizeVisibleUrlField(
        websiteField
      );


      if (
        !validateForm()
      ) {
        return;
      }


      var data = {};


      var formData =
        new FormData(
          form
        );


      formData.forEach(
        function (
          value,
          key
        ) {

          if (
            key ===
            "businessChallenges"
          ) {

            data[key] =
              data[key] || [];


            data[key].push(
              value
            );

          } else {

            data[key] =
              value;

          }

        }
      );


      data.businessChallenges =
        data.businessChallenges ||
        [];


      data.consentToContact =
        form.elements
          .consentToContact
          .checked;


      data.sessionToken =
        token;


      data.visitorId =
        visitor;


      data.submissionToken =
        (
          window.crypto &&
          crypto.randomUUID
        )
          ? crypto.randomUUID()
          : String(Date.now());


      data.slotStart =
        slot.start;


      data.slotEnd =
        slot.end;


      /*
       * Disable button so duplicate clicks cannot create
       * duplicate booking attempts.
       */
      confirmButton.disabled =
        true;


      confirmButton.textContent =
        "Confirming...";


      google.script.run

        .withFailureHandler(
          function (error) {

            confirmButton.disabled =
              false;


            confirmButton.textContent =
              "Confirm Appointment";


            serverFailure(
              error
            );

          }
        )

        .withSuccessHandler(
          function (result) {

            if (
              !result ||
              !result.success
            ) {

              confirmButton.disabled =
                false;


              confirmButton.textContent =
                "Confirm Appointment";


              showError(
                (
                  result &&
                  result.message
                )
                  ? result.message
                  : "The appointment could not be confirmed."
              );


              return;

            }


            form.classList.add(
              "hidden"
            );


            document.getElementById(
              "done"
            ).innerHTML =

              "<h2>Consultation Confirmed</h2>" +

              "<p>Your CCC reference number is:</p>" +

              "<strong>" +

                escapeHtml(
                  result.data
                    .appointmentId
                ) +

              "</strong>" +

              "<p>" +

                escapeHtml(
                  result.data
                    .appointmentDate
                ) +

                "<br>" +

                escapeHtml(
                  result.data
                    .appointmentTime
                ) +

                "<br>" +

                escapeHtml(
                  result.data
                    .timeZone
                ) +

              "</p>" +

              "<p>A confirmation has been sent by email.</p>";


            document.getElementById(
              "done"
            ).classList.remove(
              "hidden"
            );


            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          }
        )

        .confirmConsultation(
          data
        );

    }
  );


  /* ========================================================
     HTML ESCAPE
  ======================================================== */

  function escapeHtml(
    value
  ) {

    return String(
      value == null
        ? ""
        : value
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* ========================================================
     START SECURE SESSION
  ======================================================== */

  google.script.run

    .withFailureHandler(
      function (error) {

        calendarLoading.classList.add(
          "hidden"
        );

        serverFailure(
          error
        );

      }
    )

    .withSuccessHandler(
      function (result) {

        if (
          !result ||
          !result.success
        ) {

          calendarLoading.classList.add(
            "hidden"
          );


          showError(
            (
              result &&
              result.message
            )
              ? result.message
              : "The scheduling session could not be started."
          );


          return;

        }


        token =
          result.data
            .sessionToken;


        /*
         * Version 4:
         * There is no Step 1 / Step 2 / Step 3 / Step 4.
         * The calendar loads immediately on the single page.
         */
        loadCalendar();

      }
    )

    .createSchedulerSession(
      visitor
    );


})();

</script>
