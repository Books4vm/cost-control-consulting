<!DOCTYPE html><html><head><base target="_top"><?!= include("CSS"); ?></head><body><header><h1>Cost Control Consulting</h1><p>Clarity. Confidence. Compliance.</p></header><main><section class="card"><div class="progress"><span id="stepLabel">Step 1 of 4</span><div><b id="bar"></b></div></div><div id="msg" class="msg hidden"></div><form id="f"><section class="step active" data-step="1"><h2>About You</h2><div class="grid"><label>First Name*<input name="firstName" required></label><label>Last Name*<input name="lastName" required></label><label>Job Title<input name="jobTitle"></label><label>Email*<input name="email" type="email" required></label><label>Phone<input name="phone"></label><label>Preferred Contact Method<select name="preferredContactMethod"><option value="">Select</option><option>Email</option><option>Phone</option><option>Video Conference</option></select></label></div></section><section class="step" data-step="2"><h2>About Your Business</h2><div class="grid"><label>Company Name*<input name="companyName" required></label><label>Business Type*<select name="businessType" required><option value="">Select</option><option>Sole Proprietorship</option><option>Partnership</option><option>LLC</option><option>S Corporation</option><option>C Corporation</option><option>Nonprofit</option><option>Other</option></select></label><label>Industry*<input name="industry" required></label><label>Employees<select name="employeeRange"><option value="">Select</option><option>1</option><option>2-10</option><option>11-25</option><option>26-50</option><option>51-100</option><option>101-250</option><option>251+</option></select></label><label>Annual Revenue<select name="annualRevenueRange"><option value="">Select</option><option>Pre-revenue</option><option>Under $250,000</option><option>$250,000-$999,999</option><option>$1M-$4.99M</option><option>$5M-$24.99M</option><option>$25M-$99.99M</option><option>$100M+</option></select></label><label>Website<input name="website" placeholder="https://"></label><label>Accounting Software<input name="accountingSoftware"></label><label>ERP System<input name="erpSystem"></label></div></section><section class="step" data-step="3"><h2>How Can We Help?</h2><label>Primary Service*<select name="primaryAreaOfInterest" required><option value="">Select</option><option>Financial Analysis</option><option>Cost Reduction</option><option>Internal Controls</option><option>Budgeting and Forecasting</option><option>CFO Advisory</option><option>Financial Reporting</option><option>Accounting System Review</option><option>Tax Support</option><option>Process Improvement</option><option>Other</option></select></label><fieldset><legend>Business Challenges</legend><div class="checks"><label><input type="checkbox" name="businessChallenges" value="Cash Flow">Cash Flow</label><label><input type="checkbox" name="businessChallenges" value="Profitability">Profitability</label><label><input type="checkbox" name="businessChallenges" value="Cost Control">Cost Control</label><label><input type="checkbox" name="businessChallenges" value="Internal Controls">Internal Controls</label><label><input type="checkbox" name="businessChallenges" value="Reporting">Reporting</label><label><input type="checkbox" name="businessChallenges" value="Compliance">Compliance</label></div></fieldset><label>Describe the Business Challenge*<textarea name="businessChallengeDescription" required></textarea></label><label>Desired Outcome<textarea name="desiredOutcome"></textarea></label></section><section class="step" data-step="4"><h2>Choose Date and Time</h2><div class="grid"><label>Date*<select id="date" required><option value="">Loading...</option></select></label><label>Time*<select id="time" required disabled><option value="">Select a date</option></select></label></div><label class="consent"><input type="checkbox" name="consentToContact" required>I confirm the information and authorize CCC to contact me.</label><div id="review"></div></section><div class="actions"><button type="button" id="back" class="secondary">Back</button><button type="button" id="next">Next</button><button type="submit" id="confirm" class="hidden">Confirm Appointment</button></div></form><section id="done" class="hidden done"></section></section></main><footer>Cost Control Consulting</footer><?!= include("JavaScript"); ?></body></html>
