<style>:root{--b:#1f5d8f;--d:#123f60;--s:#eef7fd;--bd:#cfe5f5}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--s);color:#17324d}header{background:#9fd3f4;border-bottom:5px solid var(--b);padding:22px;text-align:center}header h1{margin:0;color:var(--d)}main{padding:32px 16px}.card{max-width:900px;margin:auto;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:28px;box-shadow:0 12px 30px rgba(31,93,143,.12)}.step{display:none}.step.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label,legend{font-weight:700}input,select,textarea{width:100%;margin-top:6px;padding:11px;border:1px solid #b8d3e5;border-radius:8px;font:inherit}textarea{min-height:120px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.checks input,.consent input{width:auto;margin-right:7px}.actions{display:flex;justify-content:space-between;margin-top:24px;padding-top:20px;border-top:1px solid var(--bd)}button{border:0;border-radius:8px;padding:12px 18px;background:var(--b);color:#fff;font-weight:700}.secondary{background:#e6f1f8;color:var(--d)}.hidden{display:none!important}.progress div{height:8px;background:#e6f1f8;border-radius:10px}.progress b{display:block;height:100%;width:25%;background:var(--b);border-radius:10px}.msg{padding:12px;background:#fff1f1;color:#a82828;margin:16px 0}.consent{display:block;margin-top:20px;padding:14px;border:1px solid var(--bd);border-radius:8px}.done{text-align:center}.done strong{font-size:28px;color:var(--d)}footer{background:var(--d);color:#fff;padding:18px;text-align:center}@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}}</style>
