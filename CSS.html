<style>

:root {

  --ccc-navy: #123f60;
  --ccc-blue: #1f5d8f;
  --ccc-blue-light: #9fd3f4;

  --ccc-background: #eef7fd;
  --ccc-panel: #ffffff;

  --ccc-text: #17324d;
  --ccc-muted: #66798a;
  --ccc-border: #cfdeea;

  --ccc-green: #197a43;
  --ccc-green-bg: #e8f7ee;
  --ccc-green-border: #8bcba6;

  --ccc-red: #b63838;
  --ccc-red-bg: #fff0f0;
  --ccc-red-border: #e6aaaa;

  --ccc-gray: #7d8992;
  --ccc-gray-bg: #f1f4f6;
  --ccc-gray-border: #d7dfe4;

  --ccc-shadow:
    0 14px 36px rgba(18, 63, 96, 0.12);

}


/* ==========================================================
   GLOBAL
========================================================== */

* {
  box-sizing: border-box;
}


html {
  min-height: 100%;
}


body {

  margin: 0;

  min-height: 100vh;

  background:
    var(--ccc-background);

  color:
    var(--ccc-text);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  line-height: 1.5;

}


button,
input,
select,
textarea {
  font: inherit;
}


button {
  cursor: pointer;
}


.hidden {
  display: none !important;
}


/* ==========================================================
   HEADER
========================================================== */

.ccc-header {

  background:
    linear-gradient(
      135deg,
      var(--ccc-navy),
      var(--ccc-blue)
    );

  color: #ffffff;

  box-shadow:
    0 4px 14px
    rgba(18, 63, 96, 0.16);

}


.ccc-header-inner {

  max-width: 1080px;

  margin: 0 auto;

  padding:
    26px 24px;

}


.ccc-header h1 {

  margin: 0;

  font-size: 30px;

  line-height: 1.15;

}


.ccc-header p {

  margin:
    7px 0 0;

  color: #dceefa;

  font-size: 15px;

}


/* ==========================================================
   PAGE
========================================================== */

.page-shell {

  width: 100%;

  max-width: 1080px;

  margin: 0 auto;

  padding:
    34px 22px 10px;

}


.form-card {

  background:
    var(--ccc-panel);

  border:
    1px solid
    var(--ccc-border);

  border-radius: 14px;

  box-shadow:
    var(--ccc-shadow);

  overflow: hidden;

}


/* ==========================================================
   INTRODUCTION
========================================================== */

.form-introduction {

  padding:
    30px 32px 25px;

  border-bottom:
    1px solid
    var(--ccc-border);

}


.form-introduction h2 {

  margin:
    0 0 6px;

  color:
    var(--ccc-navy);

  font-size: 27px;

}


.form-introduction p {

  margin: 0;

  color:
    var(--ccc-muted);

}


/* ==========================================================
   MESSAGE
========================================================== */

.msg {

  margin:
    22px 32px 0;

  padding:
    13px 15px;

  border:
    1px solid
    var(--ccc-red-border);

  border-radius: 9px;

  background:
    var(--ccc-red-bg);

  color: #8e2929;

  font-weight: 700;

}


/* ==========================================================
   FORM SECTIONS
========================================================== */

.form-section {

  padding:
    30px 32px;

  border-bottom:
    1px solid
    var(--ccc-border);

}


.form-section:last-of-type {
  border-bottom: 0;
}


.section-heading {

  display: flex;

  align-items: flex-start;

  gap: 14px;

  margin-bottom: 24px;

}


.section-number {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  flex:
    0 0 34px;

  width: 34px;

  height: 34px;

  border-radius: 50%;

  background:
    var(--ccc-blue);

  color: #ffffff;

  font-weight: 700;

}


.section-heading h3 {

  margin: 0;

  color:
    var(--ccc-navy);

  font-size: 21px;

}


.section-heading p {

  margin:
    4px 0 0;

  color:
    var(--ccc-muted);

  font-size: 14px;

}


/* ==========================================================
   SUBSECTION HEADINGS
========================================================== */

.subsection-heading {

  margin:
    28px 0 17px;

  padding-top: 22px;

  border-top:
    1px solid
    var(--ccc-border);

}


.subsection-heading h4 {

  margin: 0;

  color:
    var(--ccc-navy);

  font-size: 17px;

}


.subsection-heading p {

  margin:
    4px 0 0;

  color:
    var(--ccc-muted);

  font-size: 12px;

}


/* ==========================================================
   FORM CONTROLS
========================================================== */

.grid {

  display: grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0, 1fr)
    );

  gap:
    18px 20px;

}


label {

  display: block;

  color:
    var(--ccc-text);

  font-size: 14px;

  font-weight: 700;

}


input,
select,
textarea {

  display: block;

  width: 100%;

  margin-top: 7px;

  padding:
    11px 12px;

  border:
    1px solid #b9cbd8;

  border-radius: 8px;

  background: #ffffff;

  color:
    var(--ccc-text);

  outline: none;

  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease;

}


input:focus,
select:focus,
textarea:focus {

  border-color:
    var(--ccc-blue);

  box-shadow:
    0 0 0 3px
    rgba(31, 93, 143, 0.13);

}


textarea {

  min-height: 115px;

  resize: vertical;

}


.field-help {

  display: block;

  margin-top: 5px;

  color:
    var(--ccc-muted);

  font-size: 11px;

  font-weight: 400;

}


/* ==========================================================
   CHECKBOX GROUP
========================================================== */

fieldset {

  margin:
    22px 0;

  padding: 18px;

  border:
    1px solid
    var(--ccc-border);

  border-radius: 10px;

}


legend {

  padding:
    0 8px;

  color:
    var(--ccc-navy);

  font-weight: 700;

}


.checks {

  display: grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0, 1fr)
    );

  gap:
    12px 18px;

}


.checks label {

  display: flex;

  align-items: center;

  gap: 8px;

  font-weight: 500;

}


.checks input {

  display: inline-block;

  width: auto;

  margin: 0;

}


/* ==========================================================
   SCHEDULER
========================================================== */

.scheduler-section {

  background: #fbfdff;

}


.timezone-row {

  display: flex;

  justify-content: flex-end;

  margin:
    -10px 0 15px;

}


.timezone-badge {

  padding:
    8px 12px;

  border:
    1px solid #b8d7eb;

  border-radius: 999px;

  background: #edf7fd;

  color:
    var(--ccc-blue);

  font-size: 13px;

  font-weight: 700;

}


.scheduler-layout {

  display: grid;

  grid-template-columns:
    minmax(0, 1.6fr)
    minmax(260px, 0.85fr);

  gap: 22px;

  align-items: start;

}


.calendar-card,
.time-card {

  border:
    1px solid
    var(--ccc-border);

  border-radius: 12px;

  background: #ffffff;

}


.calendar-card {
  padding: 20px;
}


.time-card {

  min-height: 250px;

  padding: 20px;

}


.calendar-title-row {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  margin-bottom: 12px;

}


.calendar-title-row h4,
.time-card h4 {

  margin: 0;

  color:
    var(--ccc-navy);

  font-size: 18px;

}


.calendar-title-row p,
.time-help {

  margin:
    4px 0 0;

  color:
    var(--ccc-muted);

  font-size: 13px;

  font-weight: 400;

}


.text-button {

  padding:
    6px 9px;

  border: 0;

  background: transparent;

  color:
    var(--ccc-blue);

  font-size: 13px;

  font-weight: 700;

}


.text-button:hover {
  text-decoration: underline;
}


/* ==========================================================
   LEGEND
========================================================== */

.calendar-legend {

  display: flex;

  flex-wrap: wrap;

  gap: 13px;

  margin:
    15px 0 18px;

  color:
    var(--ccc-muted);

  font-size: 12px;

}


.calendar-legend span {

  display: inline-flex;

  align-items: center;

  gap: 6px;

}


.legend-dot {

  width: 10px;

  height: 10px;

  border-radius: 50%;

}


.legend-dot.available {

  background:
    var(--ccc-green);

}


.legend-dot.full {

  background:
    var(--ccc-red);

}


.legend-dot.unavailable {

  background:
    var(--ccc-gray);

}


/* ==========================================================
   CALENDAR
========================================================== */

.calendar-loading,
.time-loading {

  padding: 18px;

  border-radius: 8px;

  background: #f5f9fc;

  color:
    var(--ccc-muted);

  text-align: center;

  font-size: 13px;

}


.calendar-weekdays {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  margin-bottom: 6px;

}


.calendar-weekdays span {

  padding:
    7px 2px;

  color:
    var(--ccc-muted);

  text-align: center;

  font-size: 11px;

  font-weight: 700;

  text-transform: uppercase;

}


.calendar-grid {

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  gap: 7px;

}


.calendar-day {

  position: relative;

  min-height: 74px;

  padding:
    8px 5px 6px;

  border:
    1px solid
    var(--ccc-gray-border);

  border-radius: 9px;

  background:
    var(--ccc-gray-bg);

  color:
    var(--ccc-gray);

  text-align: center;

}


button.calendar-day {

  width: 100%;

  font-family: inherit;

}


.calendar-day .month {

  display: block;

  min-height: 15px;

  font-size: 10px;

  line-height: 1;

  text-transform: uppercase;

}


.calendar-day .number {

  display: block;

  margin-top: 3px;

  font-size: 19px;

  font-weight: 700;

  line-height: 1.15;

}


.calendar-day .availability {

  display: block;

  margin-top: 5px;

  min-height: 16px;

  font-size: 10px;

  font-weight: 700;

}


.calendar-day.status-available {

  border-color:
    var(--ccc-green-border);

  background:
    var(--ccc-green-bg);

  color:
    var(--ccc-green);

  cursor: pointer;

}


.calendar-day.status-available:hover {

  border-color:
    var(--ccc-green);

  box-shadow:
    0 4px 12px
    rgba(25, 122, 67, 0.14);

  transform:
    translateY(-1px);

}


.calendar-day.status-available.selected {

  border:
    2px solid
    var(--ccc-green);

  background: #d8f2e2;

  box-shadow:
    0 0 0 3px
    rgba(25, 122, 67, 0.12);

}


.calendar-day.status-full {

  border-color:
    var(--ccc-red-border);

  background:
    var(--ccc-red-bg);

  color:
    var(--ccc-red);

}


.calendar-day.status-weekend,
.calendar-day.status-past,
.calendar-day.status-lead,
.calendar-day.status-outside {

  border-color:
    var(--ccc-gray-border);

  background:
    var(--ccc-gray-bg);

  color: #89949c;

}


/* ==========================================================
   LIVE AVAILABILITY WAITING INDICATOR
========================================================== */

.time-loading-alert {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 13px;

  margin-top: 16px;

  padding:
    17px 15px;

  border:
    1px solid
    #9fc9e4;

  border-radius: 9px;

  background:
    #eef8fe;

  color:
    var(--ccc-blue);

  text-align: left;

  font-size: 13px;

  font-weight: 600;

  animation:
    cccLoadingPulse
    1.15s
    ease-in-out
    infinite;

}


.loading-indicator {

  display: inline-flex;

  align-items: center;

  gap: 4px;

  flex:
    0 0 auto;

}


.loading-dot {

  width: 8px;

  height: 8px;

  border-radius: 50%;

  background:
    var(--ccc-blue);

  animation:
    cccLoadingDot
    0.8s
    ease-in-out
    infinite alternate;

}


.loading-dot:nth-child(2) {
  animation-delay: 0.15s;
}


.loading-dot:nth-child(3) {
  animation-delay: 0.30s;
}


.loading-message strong {

  display: block;

  margin-top: 2px;

  color:
    var(--ccc-navy);

}


@keyframes cccLoadingPulse {

  0%,
  100% {

    box-shadow:
      0 0 0 0
      rgba(31, 93, 143, 0.05);

  }

  50% {

    box-shadow:
      0 0 0 5px
      rgba(31, 93, 143, 0.10);

  }

}


@keyframes cccLoadingDot {

  from {

    opacity: 0.35;

    transform:
      scale(0.75);

  }

  to {

    opacity: 1;

    transform:
      scale(1.20);

  }

}


/* ==========================================================
   TIME BUTTONS
========================================================== */

.time-grid {

  display: grid;

  grid-template-columns: 1fr;

  gap: 9px;

  margin-top: 18px;

}


.time-option {

  width: 100%;

  padding:
    11px 10px;

  border:
    1px solid #aacadd;

  border-radius: 8px;

  background: #f3f9fd;

  color:
    var(--ccc-navy);

  font-size: 13px;

  font-weight: 700;

  text-align: center;

}


.time-option:hover {

  border-color:
    var(--ccc-blue);

  background: #e5f3fb;

}


.time-option.selected {

  border-color:
    var(--ccc-blue);

  background:
    var(--ccc-blue);

  color: #ffffff;

}


.no-times {

  padding: 16px;

  border-radius: 8px;

  background:
    var(--ccc-red-bg);

  color:
    var(--ccc-red);

  text-align: center;

  font-size: 13px;

}


/* ==========================================================
   SELECTED APPOINTMENT
========================================================== */

.selection-summary {

  margin-top: 20px;

  padding:
    15px 17px;

  border-left:
    4px solid
    var(--ccc-green);

  border-radius: 8px;

  background:
    var(--ccc-green-bg);

  color:
    var(--ccc-text);

}


.selection-summary strong {

  color:
    var(--ccc-green);

}


/* ==========================================================
   FINAL CONFIRMATION
========================================================== */

.final-section {

  background: #f8fbfd;

}


.consent {

  display: flex;

  align-items: flex-start;

  gap: 10px;

  padding: 15px;

  border:
    1px solid
    var(--ccc-border);

  border-radius: 9px;

  background: #ffffff;

  font-weight: 500;

}


.consent input {

  flex:
    0 0 auto;

  width: auto;

  margin:
    4px 0 0;

}


.confirm-area {

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 24px;

  margin-top: 24px;

}


.confirm-area strong {

  color:
    var(--ccc-navy);

  font-size: 17px;

}


.confirm-area p {

  margin:
    4px 0 0;

  color:
    var(--ccc-muted);

  font-size: 13px;

}


#confirm {

  flex:
    0 0 auto;

  min-width: 190px;

  padding:
    13px 22px;

  border:
    1px solid
    var(--ccc-blue);

  border-radius: 8px;

  background:
    var(--ccc-blue);

  color: #ffffff;

  font-weight: 700;

}


#confirm:hover:not(:disabled) {

  border-color:
    var(--ccc-navy);

  background:
    var(--ccc-navy);

}


#confirm:disabled {

  opacity: 0.55;

  cursor: not-allowed;

}


/* ==========================================================
   SUCCESS
========================================================== */

.done {

  margin: 30px;

  padding: 28px;

  border:
    1px solid
    var(--ccc-green-border);

  border-radius: 12px;

  background:
    var(--ccc-green-bg);

  text-align: center;

}


.done h2 {

  color:
    var(--ccc-green);

}


.done strong {

  display: inline-block;

  margin:
    10px 0;

  font-size: 24px;

  color:
    var(--ccc-navy);

}


/* ==========================================================
   FOOTER
========================================================== */

.ccc-footer {

  margin-top: 42px;

  padding: 24px;

  background:
    var(--ccc-navy);

  color: #ffffff;

  text-align: center;

  font-size: 14px;

}


/* ==========================================================
   RESPONSIVE
========================================================== */

@media (max-width: 820px) {

  .grid {

    grid-template-columns:
      1fr;

  }


  .checks {

    grid-template-columns:
      1fr 1fr;

  }


  .scheduler-layout {

    grid-template-columns:
      1fr;

  }


  .time-grid {

    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );

  }

}


@media (max-width: 560px) {

  .page-shell {

    padding:
      18px 10px;

  }


  .form-introduction,
  .form-section {

    padding:
      22px 16px;

  }


  .msg {

    margin:
      18px 16px 0;

  }


  .ccc-header-inner {

    padding:
      21px 16px;

  }


  .ccc-header h1 {

    font-size: 24px;

  }


  .calendar-card,
  .time-card {

    padding: 13px;

  }


  .calendar-grid {

    gap: 4px;

  }


  .calendar-day {

    min-height: 65px;

    padding:
      6px 2px;

  }


  .calendar-day .number {

    font-size: 17px;

  }


  .calendar-day .availability {

    font-size: 9px;

  }


  .calendar-day .month {

    font-size: 9px;

  }


  .checks {

    grid-template-columns:
      1fr;

  }


  .time-grid {

    grid-template-columns:
      1fr;

  }


  .time-loading-alert {

    align-items: flex-start;

  }


  .confirm-area {

    display: block;

  }


  #confirm {

    width: 100%;

    margin-top: 18px;

  }

}

</style>
