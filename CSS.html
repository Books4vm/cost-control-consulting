<style>

:root {
  --ccc-navy: #123f60;
  --ccc-blue: #1f5d8f;
  --ccc-blue-medium: #2f78aa;
  --ccc-blue-light: #9fd3f4;
  --ccc-background: #eef7fd;
  --ccc-panel: #ffffff;

  --ccc-text: #17324d;
  --ccc-muted: #66798a;
  --ccc-border: #cfdeea;

  --ccc-green: #197a43;
  --ccc-green-bg: #e8f7ee;
  --ccc-green-border: #8bcba6;

  --ccc-red: #b63838;
  --ccc-red-bg: #fff0f0;
  --ccc-red-border: #e6aaaa;

  --ccc-gray: #7d8992;
  --ccc-gray-bg: #f1f4f6;
  --ccc-gray-border: #d7dfe4;

  --ccc-shadow:
    0 14px 36px rgba(18, 63, 96, 0.12);

  --ccc-radius: 14px;
}


/* ----------------------------------------------------------
   GLOBAL
---------------------------------------------------------- */

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--ccc-background);
  color: var(--ccc-text);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  line-height: 1.5;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}


/* ----------------------------------------------------------
   HEADER / FOOTER
---------------------------------------------------------- */

.ccc-header {
  background: linear-gradient(
    135deg,
    var(--ccc-navy),
    var(--ccc-blue)
  );
  color: #ffffff;
  box-shadow:
    0 4px 14px rgba(18, 63, 96, 0.16);
}

.ccc-header-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 26px 24px;
}

.ccc-header h1 {
  margin: 0;
  font-size: 30px;
  line-height: 1.15;
}

.ccc-header p {
  margin: 7px 0 0;
  color: #dceefa;
  font-size: 15px;
}

.ccc-footer {
  margin-top: 42px;
  padding: 24px;
  background: var(--ccc-navy);
  color: #ffffff;
  text-align: center;
  font-size: 14px;
}


/* ----------------------------------------------------------
   MAIN CARD
---------------------------------------------------------- */

.page-shell {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 34px 22px 10px;
}

.card {
  background: var(--ccc-panel);
  border: 1px solid var(--ccc-border);
  border-radius: var(--ccc-radius);
  box-shadow: var(--ccc-shadow);
  padding: 30px;
}

.card h2 {
  margin: 0 0 5px;
  color: var(--ccc-navy);
  font-size: 25px;
}

.step-intro {
  margin: 0 0 24px;
  color: var(--ccc-muted);
}


/* ----------------------------------------------------------
   PROGRESS
---------------------------------------------------------- */

.progress {
  margin-bottom: 30px;
}

.progress > span {
  display: block;
  margin-bottom: 9px;
  color: var(--ccc-navy);
  font-weight: 700;
  font-size: 14px;
}

.progress-track,
.progress > div {
  height: 8px;
  overflow: hidden;
  background: #dce9f2;
  border-radius: 999px;
}

#bar {
  display: block;
  width: 25%;
  height: 100%;
  background: linear-gradient(
    90deg,
    var(--ccc-blue),
    var(--ccc-blue-light)
  );
  border-radius: 999px;
  transition: width 0.25s ease;
}


/* ----------------------------------------------------------
   FORM
---------------------------------------------------------- */

.step {
  display: none;
}

.step.active {
  display: block;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 18px 20px;
}

label {
  display: block;
  color: var(--ccc-text);
  font-size: 14px;
  font-weight: 700;
}

input,
select,
textarea {
  display: block;
  width: 100%;
  margin-top: 7px;
  padding: 11px 12px;
  border: 1px solid #b9cbd8;
  border-radius: 8px;
  background: #ffffff;
  color: var(--ccc-text);
  outline: none;
  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--ccc-blue);
  box-shadow:
    0 0 0 3px rgba(31, 93, 143, 0.13);
}

textarea {
  min-height: 120px;
  resize: vertical;
}

fieldset {
  margin: 22px 0;
  padding: 18px;
  border: 1px solid var(--ccc-border);
  border-radius: 10px;
}

legend {
  padding: 0 8px;
  color: var(--ccc-navy);
  font-weight: 700;
}

.checks {
  display: grid;
  grid-template-columns:
    repeat(3, minmax(0, 1fr));
  gap: 12px 18px;
}

.checks label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}

.checks input {
  display: inline-block;
  width: auto;
  margin: 0;
}


/* ----------------------------------------------------------
   MESSAGES
---------------------------------------------------------- */

.msg {
  margin-bottom: 22px;
  padding: 13px 15px;
  border: 1px solid var(--ccc-red-border);
  border-radius: 9px;
  background: var(--ccc-red-bg);
  color: #8e2929;
  font-weight: 700;
}

.hidden {
  display: none !important;
}


/* ----------------------------------------------------------
   SCHEDULER
---------------------------------------------------------- */

.scheduler-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
}

.timezone-badge {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: 1px solid #b8d7eb;
  border-radius: 999px;
  background: #edf7fd;
  color: var(--ccc-blue);
  font-size: 13px;
  font-weight: 700;
}

.scheduler-layout {
  display: grid;
  grid-template-columns:
    minmax(0, 1.6fr)
    minmax(260px, 0.85fr);
  gap: 22px;
  align-items: start;
}

.calendar-card,
.time-card {
  border: 1px solid var(--ccc-border);
  border-radius: 12px;
  background: #ffffff;
}

.calendar-card {
  padding: 20px;
}

.time-card {
  min-height: 250px;
  padding: 20px;
}

.calendar-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.calendar-title-row h3,
.time-card h3 {
  margin: 0;
  color: var(--ccc-navy);
  font-size: 18px;
}

.calendar-title-row p,
.time-help {
  margin: 4px 0 0;
  color: var(--ccc-muted);
  font-size: 13px;
  font-weight: 400;
}

.text-button {
  padding: 6px 9px;
  border: 0;
  background: transparent;
  color: var(--ccc-blue);
  font-size: 13px;
  font-weight: 700;
}

.text-button:hover {
  text-decoration: underline;
}


/* ----------------------------------------------------------
   LEGEND
---------------------------------------------------------- */

.calendar-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin: 15px 0 18px;
  color: var(--ccc-muted);
  font-size: 12px;
}

.calendar-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.legend-dot.available {
  background: var(--ccc-green);
}

.legend-dot.full {
  background: var(--ccc-red);
}

.legend-dot.unavailable {
  background: var(--ccc-gray);
}


/* ----------------------------------------------------------
   CALENDAR
---------------------------------------------------------- */

.calendar-loading,
.time-loading {
  padding: 18px;
  border-radius: 8px;
  background: #f5f9fc;
  color: var(--ccc-muted);
  text-align: center;
  font-size: 13px;
}

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 6px;
}

.calendar-weekdays span {
  padding: 7px 2px;
  color: var(--ccc-muted);
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 7px;
}

.calendar-day {
  position: relative;
  min-height: 74px;
  padding: 8px 5px 6px;
  border: 1px solid var(--ccc-gray-border);
  border-radius: 9px;
  background: var(--ccc-gray-bg);
  color: var(--ccc-gray);
  text-align: center;
}

button.calendar-day {
  width: 100%;
  font-family: inherit;
}

.calendar-day .month {
  display: block;
  min-height: 15px;
  font-size: 10px;
  line-height: 1;
  text-transform: uppercase;
}

.calendar-day .number {
  display: block;
  margin-top: 3px;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.15;
}

.calendar-day .availability {
  display: block;
  margin-top: 5px;
  min-height: 16px;
  font-size: 10px;
  font-weight: 700;
}


/* AVAILABLE */

.calendar-day.status-available {
  border-color: var(--ccc-green-border);
  background: var(--ccc-green-bg);
  color: var(--ccc-green);
  cursor: pointer;
}

.calendar-day.status-available:hover {
  border-color: var(--ccc-green);
  box-shadow:
    0 4px 12px rgba(25, 122, 67, 0.14);
  transform: translateY(-1px);
}

.calendar-day.status-available.selected {
  border: 2px solid var(--ccc-green);
  background: #d8f2e2;
  box-shadow:
    0 0 0 3px rgba(25, 122, 67, 0.12);
}


/* FULL */

.calendar-day.status-full {
  border-color: var(--ccc-red-border);
  background: var(--ccc-red-bg);
  color: var(--ccc-red);
}


/* NOT BOOKABLE */

.calendar-day.status-weekend,
.calendar-day.status-past,
.calendar-day.status-lead,
.calendar-day.status-outside {
  border-color: var(--ccc-gray-border);
  background: var(--ccc-gray-bg);
  color: #89949c;
}


/* ----------------------------------------------------------
   TIME BUTTONS
---------------------------------------------------------- */

.time-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;
  margin-top: 18px;
}

.time-option {
  width: 100%;
  padding: 11px 10px;
  border: 1px solid #aacadd;
  border-radius: 8px;
  background: #f3f9fd;
  color: var(--ccc-navy);
  font-size: 13px;
  font-weight: 700;
  text-align: center;
}

.time-option:hover {
  border-color: var(--ccc-blue);
  background: #e5f3fb;
}

.time-option.selected {
  border-color: var(--ccc-blue);
  background: var(--ccc-blue);
  color: #ffffff;
}

.no-times {
  padding: 16px;
  border-radius: 8px;
  background: var(--ccc-red-bg);
  color: var(--ccc-red);
  text-align: center;
  font-size: 13px;
}


/* ----------------------------------------------------------
   SELECTED APPOINTMENT
---------------------------------------------------------- */

.selection-summary {
  margin-top: 20px;
  padding: 15px 17px;
  border-left: 4px solid var(--ccc-green);
  border-radius: 8px;
  background: var(--ccc-green-bg);
  color: var(--ccc-text);
}

.selection-summary strong {
  color: var(--ccc-green);
}


/* ----------------------------------------------------------
   CONSENT
---------------------------------------------------------- */

.consent {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 23px;
  padding: 15px;
  border: 1px solid var(--ccc-border);
  border-radius: 9px;
  background: #f8fbfd;
  font-weight: 500;
}

.consent input {
  flex: 0 0 auto;
  width: auto;
  margin: 4px 0 0;
}


/* ----------------------------------------------------------
   BUTTONS
---------------------------------------------------------- */

.actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--ccc-border);
}

.actions button {
  min-width: 115px;
  padding: 11px 18px;
  border: 1px solid var(--ccc-blue);
  border-radius: 8px;
  background: var(--ccc-blue);
  color: #ffffff;
  font-weight: 700;
}

.actions button:hover:not(:disabled) {
  background: var(--ccc-navy);
  border-color: var(--ccc-navy);
}

.actions button.secondary {
  background: #ffffff;
  color: var(--ccc-blue);
}

.actions button.secondary:hover:not(:disabled) {
  background: #edf6fc;
  color: var(--ccc-navy);
}

.actions button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}


/* ----------------------------------------------------------
   SUCCESS
---------------------------------------------------------- */

.done {
  padding: 28px;
  border: 1px solid var(--ccc-green-border);
  border-radius: 12px;
  background: var(--ccc-green-bg);
  text-align: center;
}

.done h2 {
  color: var(--ccc-green);
}

.done strong {
  display: inline-block;
  margin: 10px 0;
  font-size: 24px;
  color: var(--ccc-navy);
}


/* ----------------------------------------------------------
   RESPONSIVE
---------------------------------------------------------- */

@media (max-width: 820px) {

  .grid {
    grid-template-columns: 1fr;
  }

  .checks {
    grid-template-columns: 1fr 1fr;
  }

  .scheduler-layout {
    grid-template-columns: 1fr;
  }

  .time-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

}


@media (max-width: 560px) {

  .page-shell {
    padding: 18px 10px;
  }

  .card {
    padding: 19px 14px;
  }

  .ccc-header-inner {
    padding: 21px 16px;
  }

  .ccc-header h1 {
    font-size: 24px;
  }

  .scheduler-heading {
    display: block;
  }

  .timezone-badge {
    display: inline-block;
    margin-top: 8px;
  }

  .calendar-card,
  .time-card {
    padding: 13px;
  }

  .calendar-grid {
    gap: 4px;
  }

  .calendar-day {
    min-height: 65px;
    padding: 6px 2px;
  }

  .calendar-day .number {
    font-size: 17px;
  }

  .calendar-day .availability {
    font-size: 9px;
  }

  .calendar-day .month {
    font-size: 9px;
  }

  .checks {
    grid-template-columns: 1fr;
  }

  .time-grid {
    grid-template-columns: 1fr;
  }

  .actions {
    flex-wrap: wrap;
  }

  .actions button {
    flex: 1 1 120px;
  }

}

</style>
